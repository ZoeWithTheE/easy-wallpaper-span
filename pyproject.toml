[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "easy-wallpaper-span"
version = "0.1.0"
description = "Span a single wallpaper across multiple monitors in KDE Plasma"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["PyQt6>=6.4"]

[project.scripts]
easy-wallpaper-span = "easy_wallpaper_span.gui:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["easy_wallpaper_span*"]
